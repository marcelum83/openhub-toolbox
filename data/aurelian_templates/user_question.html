<div style="font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background: rgba(26, 40, 56, 0.9); backdrop-filter: blur(12px); color: #e0e7ee; padding: 28px; border-radius: 14px; border: 1px solid rgba(102, 199, 247, 0.4); margin-bottom: 20px; box-shadow: 0 8px 30px rgba(0,0,0,0.5); max-width: 100%;">
    <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 22px; border-bottom: 1px solid rgba(102, 199, 247, 0.3); padding-bottom: 14px;">
        <h3 style="color: #66c7f7; margin: 0; font-size: 1.15rem; letter-spacing: 1.2px; text-transform: uppercase;">
            <span style="margin-right: 10px;">❓</span>{{ title | default('Question for You') }}
        </h3>
    </div>

    <div style="font-size: 1.05rem; line-height: 1.6; color: #c0deed; margin-bottom: 25px;">
        {{ question_text | safe }}
    </div>

    {% if options %}
    <div style="display: flex; flex-direction: column; gap: 12px;">
        {% for option in options %}
        <button style="background: rgba(102, 199, 247, 0.1); border: 1px solid rgba(102, 199, 247, 0.4); color: #66c7f7; padding: 10px 18px; border-radius: 8px; font-size: 0.9rem; font-weight: 500; cursor: pointer; transition: background 0.2s, transform 0.2s; text-align: left; width: 100%;"
                onmouseover="this.style.background='rgba(102, 199, 247, 0.25)'; this.style.transform='scale(1.01)';"
                onmouseout="this.style.background='rgba(102, 199, 247, 0.1)'; this.style.transform='scale(1)';"
                onclick="sendQuestionChoice('{{ option.id }}', '{{ option.label }}')">
            {{ option.label }}
        </button>
        {% endfor %}
    </div>
    {% endif %}

    {% if footer %}
    <div style="margin-top: 25px; padding-top: 15px; border-top: 1px solid rgba(255,255,255,0.08); font-size: 0.8rem; color: #8899a6; display: flex; align-items: center; justify-content: space-between;">
        <span>{{ footer }}</span>
        <span style="opacity: 0.5;">Aurelian Intelligence Unit</span>
    </div>
    {% endif %}

    <script>
        function sendQuestionChoice(choiceId, choiceLabel) {
            if (window.parent && window.parent.postMessage) {
                const message = {
                    type: 'aurelian_question_choice',
                    choice_id: choiceId,
                    choice_label: choiceLabel,
                    // You might want to add a unique ID for the question itself if multiple questions can be active
                };
                window.parent.postMessage(message, '*'); // '*' for any origin, refine for security
                console.log('Sent question choice via postMessage:', message);
            } else {
                console.error('postMessage API not available. Cannot send choice.');
                alert('Interaction error: Cannot send choice. Please ensure the Hub is connected and supports postMessage.');
            }
        }
    </script>
</div>
