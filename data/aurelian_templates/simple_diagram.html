<div
  style="font-family: 'Segoe UI', system-ui, sans-serif; background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(10px); color: #e2e8f0; padding: 25px; border-radius: 12px; border: 1px solid rgba(76, 201, 240, 0.3); margin-bottom: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);">
  <style>
    .diag-container {
      display: flex;
      flex-direction: column;
      gap: 15px;
      align-items: center;
      margin-top: 20px;
    }

    .diag-node {
      background: rgba(76, 201, 240, 0.1);
      border: 1px solid rgba(76, 201, 240, 0.4);
      padding: 12px 20px;
      border-radius: 8px;
      text-align: center;
      min-width: 150px;
      max-width: 250px;
      font-size: 0.9rem;
      position: relative;
    }

    .diag-arrow {
      color: rgba(76, 201, 240, 0.5);
      font-size: 1.2rem;
      line-height: 1;
    }

    .node-crit {
      border-color: #f87171;
      background: rgba(239, 68, 68, 0.1);
      color: #fca5a5;
    }

    .node-warn {
      border-color: #fbbf24;
      background: rgba(251, 191, 36, 0.1);
      color: #fde68a;
    }

    .diag-title {
      color: #4cc9f0;
      font-size: 0.85rem;
      text-transform: uppercase;
      font-weight: 700;
      letter-spacing: 1.5px;
      border-left: 3px solid #4cc9f0;
      padding-left: 10px;
    }
  </style>

  <div class="diag-title">{{ title | default('Strategic Impact Flow') }}</div>

  <div class="diag-container">
    {% for node in nodes | default([]) %}
    <div
      class="diag-node {% if node.type == 'critical' %}node-crit{% elif node.type == 'warning' %}node-warn{% endif %}">
      {{ node.label }}
    </div>
    {% if not loop.last %}
    <div class="diag-arrow">▼</div>
    {% endif %}
    {% endfor %}
  </div>
</div>
