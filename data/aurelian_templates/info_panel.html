<div style="font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #3b4d61; color: #e0e7ee; padding: 20px; border-radius: 8px; border: 1px solid #4a90e2; margin-bottom: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.2);">
  <h3 style="color: #61dafb; margin-top: 0; margin-bottom: 10px; border-bottom: 1px solid rgba(74, 144, 226, 0.5); padding-bottom: 5px;">{{ title | default('Information Panel') }}</h3>
  <div class="panel-content">
    {{ content | safe }}
  </div>
  {% if footer %}
  <p style="font-size: 0.9em; color: #a0a8b4; margin-top: 15px; border-top: 1px solid rgba(74, 144, 226, 0.2); padding-top: 10px;">{{ footer }}</p>
  {% endif %}
</div>
