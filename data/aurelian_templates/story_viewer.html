<div
    style="font-family: 'Georgia', serif; background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(20px); color: #e2e8f0; padding: 30px; border-radius: 15px; border: 1px solid rgba(76, 201, 240, 0.4); margin-bottom: 20px; box-shadow: 0 15px 50px rgba(0,0,0,0.6); line-height: 1.8; position: relative; overflow: hidden;">
    <style>
        .choice-btn {
            display: block;
            width: 100%;
            background: rgba(76, 201, 240, 0.1);
            border: 1px solid rgba(76, 201, 240, 0.3);
            color: #4cc9f0;
            padding: 14px 22px;
            margin-top: 12px;
            border-radius: 10px;
            text-align: left;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            font-family: 'Segoe UI', system-ui, sans-serif;
            font-size: 1rem;
            font-weight: 500;
        }

        .choice-btn:hover {
            background: rgba(76, 201, 240, 0.2);
            border-color: #4cc9f0;
            transform: translateX(8px);
            box-shadow: -4px 0 15px rgba(76, 201, 240, 0.2);
        }

        .scene-text {
            font-size: 1.15rem;
            margin-bottom: 30px;
            color: #f1f5f9;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
        }

        .narrative-header {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 2.5px;
            color: #94a3b8;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            padding-bottom: 10px;
        }

        .v-id {
            background: rgba(76, 201, 240, 0.1);
            padding: 2px 8px;
            border-radius: 4px;
            color: #4cc9f0;
            font-family: monospace;
        }
    </style>

    <div class="narrative-header">
        <div style="display: flex; align-items: center; gap: 8px;">
            <span>🌱</span> STEWARDSHIP PROTOCOL
        </div>
        <div class="v-id">#{{ scene_id | default('CORE') }}</div>
    </div>

    <div class="scene-text">
        {{ scene_text | default("Awaiting synchronization with the narrative core...") | safe }}
    </div>

    <div id="choices-container">
        {% for choice in choices | default([]) %}
        <button class="choice-btn"
            onclick="makeChoice('{{ choice.label | escape }}', '{{ choice.id | default(choice.label) | escape }}', '{{ scene_id | default('CORE') | escape }}')">
            <span style="opacity: 0.5; margin-right: 10px;">►</span> {{ choice.label }}
        </button>
        {% endfor %}
    </div>

    <script>
        function makeChoice(label, id, sceneId) {
            // RELIABLE BRIDGE: Send message to parent (chat.html)
            // Do NOT try to access window.ws directly from an iframe!
            window.parent.postMessage({
                type: 'ui_choice',
                label: label,
                id: id,
                scene: sceneId
            }, '*');
        }
    </script>
</div>
